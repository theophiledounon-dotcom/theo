<!DOCTYPE html>
<html lang="fr">
<head>
  <script>(function(){var s=localStorage.getItem('theme'),p=window.matchMedia('(prefers-color-scheme: dark)').matches,t=s||(p?'dark':'light');if(t==='dark')document.documentElement.classList.add('dark');})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie — Théophile Sèdonou DOUNON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="page-banner">
    <div class="container">
      <p class="breadcrumb"><a href="index.html" id="bc-home">Accueil</a> <span>/</span> <span id="bc-page">Galerie</span></p>
      <h1 id="banner-title">Ma <span class="text-primary">Galerie</span></h1>
      <p id="banner-sub">Captures d'écran, événements et moments marquants de mon parcours</p>
    </div>
  </section>

  <section class="section section-white">
    <div class="container">

      <div class="filter-bar reveal">
        <button class="filter-btn active" data-category="Tous" id="f-all">Tous</button>
        <button class="filter-btn" data-category="Projets" id="f-proj">Projets</button>
        <button class="filter-btn" data-category="Hackathons" id="f-hack">Hackathons</button>
        <button class="filter-btn" data-category="UNJED" id="f-unjed">UNJED-BÉNIN</button>
        <button class="filter-btn" data-category="Académique" id="f-acad">Académique</button>
      </div>

      <div class="gallery-grid reveal">
        <div class="gallery-item" data-category="Hackathons" data-title="MIABE Hackathon 2026" data-description="Équipe Darollo Technologies — DiasporaConnect, semi-finaliste">
          <div class="gallery-item-inner"><span class="gi-emoji">🏆</span><span class="gi-title">MIABE Hackathon 2026</span></div>
        </div>
        <div class="gallery-item" data-category="Projets" data-title="DiasporaConnect" data-description="Application blockchain de transfert de fonds — PWA Polygon">
          <div class="gallery-item-inner"><span class="gi-emoji">🔗</span><span class="gi-title">DiasporaConnect</span></div>
        </div>
        <div class="gallery-item" data-category="UNJED" data-title="Site UNJED-BÉNIN" data-description="Plateforme institutionnelle 8 pages, déployée sur Vercel">
          <div class="gallery-item-inner"><span class="gi-emoji">🌍</span><span class="gi-title">Site UNJED-BÉNIN</span></div>
        </div>
        <div class="gallery-item" data-category="Académique" data-title="ENSPD - Université de Parakou" data-description="Étudiant en Statistique Appliquée">
          <div class="gallery-item-inner"><span class="gi-emoji">🎓</span><span class="gi-title">ENSPD - Parakou</span></div>
        </div>
        <div class="gallery-item" data-category="Projets" data-title="DataTour 2026" data-description="Équipe Luminex — Détection de fraude mobile money, LightGBM">
          <div class="gallery-item-inner"><span class="gi-emoji">📊</span><span class="gi-title">DataTour 2026</span></div>
        </div>
        <div class="gallery-item" data-category="UNJED" data-title="Conseil Consultatif UNJED" data-description="Rôle de Secrétaire — réunions et comptes rendus">
          <div class="gallery-item-inner"><span class="gi-emoji">🤝</span><span class="gi-title">Conseil Consultatif</span></div>
        </div>
        <div class="gallery-item" data-category="Académique" data-title="Forum 10 000 Codeurs" data-description="4e édition à Bohicon — Passeport Numérique">
          <div class="gallery-item-inner"><span class="gi-emoji">💻</span><span class="gi-title">Forum 10 000 Codeurs</span></div>
        </div>
        <div class="gallery-item" data-category="Projets" data-title="Système PHP/MySQL" data-description="Inscriptions et présences — déployé sur InfinityFree">
          <div class="gallery-item-inner"><span class="gi-emoji">🗄️</span><span class="gi-title">Système PHP/MySQL</span></div>
        </div>
        <div class="gallery-item" data-category="Hackathons" data-title="EEIA - École d'Été IA" data-description="Préparation et participation à l'École d'Été sur l'Intelligence Artificielle">
          <div class="gallery-item-inner"><span class="gi-emoji">🧠</span><span class="gi-title">EEIA</span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="lightbox-close">✕</button>
      <div style="height:300px;background:linear-gradient(135deg,#1A1500,#0A0A0A);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:4rem;">🖼️</div>
      <div class="lightbox-info">
        <span class="blog-cat" id="lightbox-badge" style="margin-bottom:0.5rem;display:inline-block;"></span>
        <h4 id="lightbox-title"></h4>
        <p id="lightbox-desc"></p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/components.js" defer></script>
  <script src="js/gallery.js" defer></script>
  <script defer>
    const P={fr:{"bc-home":"Accueil","bc-page":"Galerie","banner-title":"Ma <span class=\"text-primary\">Galerie</span>","banner-sub":"Captures d'écran, événements et moments marquants de mon parcours","f-all":"Tous","f-proj":"Projets","f-hack":"Hackathons","f-unjed":"UNJED-BÉNIN","f-acad":"Académique"},en:{"bc-home":"Home","bc-page":"Gallery","banner-title":"My <span class=\"text-primary\">Gallery</span>","banner-sub":"Screenshots, events and milestones from my journey","f-all":"All","f-proj":"Projects","f-hack":"Hackathons","f-unjed":"UNJED-BÉNIN","f-acad":"Academic"}};
    window.onLangChange=function(lang){
      const d=P[lang]||P.fr;
      Object.keys(d).forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=d[id];});
      // Update "Tous"/"All" filter category attr for JS logic
      const allBtn = document.getElementById('f-all');
      if (allBtn) allBtn.dataset.category = lang === 'en' ? 'All' : 'Tous';
    };
  </script>
</body>
</html>
